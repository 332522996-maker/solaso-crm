<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>SOLASO CRM正式版</title>
<style>
    body{font-family:Arial;background:#f5f6fa;margin:0}
    .header{padding:15px;background:#4a6cf7;color:#fff;font-size:20px;display:flex;justify-content:space-between}
    .container{padding:20px}
    .card{background:#fff;padding:15px;margin-bottom:15px;border-radius:10px}
    button{padding:6px 12px;background:#4a6cf7;color:#fff;border:none;border-radius:6px;cursor:pointer}
    input,select{padding:6px;margin:5px}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:10px;border-bottom:1px solid #eee;text-align:center}
    .stats-container { display: flex; gap: 15px; }
    .stat-box { flex: 1; padding: 15px; border-radius: 12px; color: #fff; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .bg-today { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .bg-total { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .stat-val { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
    .stat-label { font-size: 14px; opacity: 0.9; }
    .notice{background:#fff3e0;padding:10px;border-left:5px solid #ff9800;margin-top:10px;font-size:14px;color:#d84315}
</style>
</head>
<body>
<div class="header"><div id="title_text">CRM系统</div><button onclick="toggleLang()">中/VN</button></div>
<div class="container">
    <div class="card"><h3 id="h_stats">📊 数据看板</h3><div id="stats" class="stats-container"></div><button onclick="showMonthlyStats()" style="margin-top:10px;background:#333">查看月度财务</button></div>
    <div class="card">
        <h3 id="h_task">🔥 今日待跟进</h3>
        <div id="taskList"></div>
        <div id="noticeList" class="notice" style="display:none"></div>
    </div>
    <div class="card">
        <h3 id="h_add">新增客户</h3>
        <input id="name" placeholder="姓名">
        <input id="phone" placeholder="电话">
        <select id="sales"><option>文商</option><option>芳青</option><option>琼如</option></select>
        <select id="status"><option value="A">A 不回复</option><option value="B">B 考虑中</option><option value="C">C 报价</option><option value="D">D 成交</option></select>
        <input id="followNote" placeholder="首次跟进">
        <input id="followTime" type="datetime-local">
        <button onclick="addCustomer()" id="btn_submit">提交</button>
    </div>
    <div class="card">
        <select id="filterSales" onchange="render()"><option value="">全部销售</option><option>文商</option><option>芳青</option><option>琼如</option></select>
        <select id="filterStatus" onchange="render()"><option value="">全部状态</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
        <button onclick="deleteSelected()">删除选中</button>
        <button onclick="showAuditReport()" style="background:#e91e63">查看已删除订单</button>
        <table><thead><tr id="table_head"></tr></thead><tbody id="list"></tbody></table>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  const db = getFirestore(initializeApp({ apiKey: "AIzaSyB49NgfhodfJjVwS7Ywr_AQxOycV9znrXc", projectId: "solaso-crm" }));

  let data = [], lang = 'zh';
  const dict = {
      'zh': { title: 'CRM系统', stats: '📊 数据看板', task: '🔥 今日待跟进', add: '新增客户', submit: '提交', head: '<th>选择</th><th>姓名</th><th>电话</th><th>销售</th><th>状态</th><th>物流</th><th>记录</th><th>操作</th>', nameP: '姓名', phoneP: '电话', log: '查看' },
      'vi': { title: 'Hệ thống CRM', stats: '📊 Bảng thống kê', task: '🔥 Follow hôm nay', add: 'Thêm khách hàng', submit: 'Gửi', head: '<th>Chọn</th><th>Tên</th><th>SĐT</th><th>NV</th><th>Trạng thái</th><th>Vận chuyển</th><th>Xem</th><th>Xóa</th>', nameP: 'Tên', phoneP: 'SĐT', log: 'Xem' }
  };

  onSnapshot(query(collection(db, "customers"), orderBy("createdAt", "desc")), (snap) => {
    data = []; snap.forEach(d => data.push({ id: d.id, ...d.data() }));
    render();
  });

  window.deleteRow = async (id, status) => {
      if (status === 'D') { if (prompt("该客户已成交，需管理员密码：") !== "8888") return alert("密码错误"); } 
      else if (!confirm("确定删除吗？")) return;
      await updateDoc(doc(db, 'customers', id), { isDeleted: true, deletedAt: new Date().toLocaleString() });
      render();
  };

  window.showAuditReport = () => {
      let audit = data.filter(c => c.isDeleted).map(c => `${c.name || '无名'} (${c.phone || '无号'}) - ${c.deletedAt}`).join('\n');
      alert(audit ? "--- 已删除记录审计 ---\n" + audit : "暂无删除记录");
  };

  window.addHistory = async (id) => {
      let note = prompt("请输入跟进内容：");
      if (!note) return;
      let c = data.find(x => x.id === id);
      await updateDoc(doc(db, 'customers', id), { follow: [...(c.follow || []), `${new Date().toLocaleString()}：${note}`] });
  };

  window.showHistory = (id) => { alert((data.find(x => x.id === id).follow || []).join('\n')); };

  window.showMonthlyStats = () => {
      let input = prompt("请输入月份 (格式: 2026-05)", "2026-05");
      if (!input) return;
      let [year, month] = input.split('-').map(Number);
      let filtered = data.filter(c => !c.isDeleted && (c.status === 'D' || c.isClosed === '是') && new Date(c.createdAt || Date.now()).getFullYear() === year && (new Date(c.createdAt || Date.now()).getMonth() + 1) === month);
      alert(`【${input}】财务报表\n成交单数：${filtered.length}\n总金额：${(filtered.length * 180000).toLocaleString()} VND`);
  };

  window.updateLogistics = async (id, val, oldVal) => {
      if (oldVal === "签收" && val === "未发货" && prompt("重置物流需密码：") !== "8888") { render(); return alert("密码错误"); }
      let updateData = { logistics: val };
      if (val === "已发货") updateData.shipAt = Date.now();
      await updateDoc(doc(db, 'customers', id), updateData);
  };

  window.addCustomer = async () => {
    let phone = document.getElementById('phone').value;
    if (data.find(c => c.phone === phone)) return alert("警告：该号码已存在！");
    await addDoc(collection(db, "customers"), {
        name: document.getElementById('name').value, phone: phone,
        sales: document.getElementById('sales').value, status: document.getElementById('status').value,
        logistics: "未发货", follow: [`${new Date().toLocaleString()}：${document.getElementById('followNote').value}`],
        nextTime: new Date(document.getElementById('followTime').value).getTime() || 0, createdAt: Date.now()
    });
    alert("OK");
  };

  window.render = function() {
    let d = dict[lang], today = new Date(), todayStr = today.toDateString();
    document.getElementById('title_text').innerText = d.title;
    document.getElementById('h_stats').innerText = d.stats;
    document.getElementById('h_add').innerText = d.add;
    document.getElementById('btn_submit').innerText = d.submit;
    document.getElementById('table_head').innerHTML = d.head;
    document.getElementById('name').placeholder = d.nameP;
    document.getElementById('phone').placeholder = d.phoneP;

    const statusSelect = document.getElementById('status');
    const labels = (lang == 'zh') ? ['A 不回复', 'B 考虑中', 'C 报价', 'D 成交'] : ['A Không phản hồi', 'B Đang cân nhắc', 'C Báo giá', 'D Chốt đơn'];
    for(let i=0; i<statusSelect.options.length; i++) statusSelect.options[i].text = labels[i];

    let listEl = document.getElementById('list'), deals=0, totalAmount=0, todayDeals=0, todayAmount=0, tasks=[], notices=[];
    const fSales = document.getElementById('filterSales').value, fStatus = document.getElementById('filterStatus').value;
    listEl.innerHTML = ''; 

    data.forEach(c => {
        let cName = c.name || "无名";
        let cPhone = c.phone || "无号";
        let cSales = c.sales || c.source || "未知";
        let cStatus = c.status || (c.isClosed === "是" ? "D" : "A");
        let cLog = c.logistics || "未发货";
        
        if(c.isDeleted || (fSales && cSales !== fSales) || (fStatus && cStatus !== fStatus)) return;
        
        let cDate = new Date(c.createdAt || Date.now());
        if(cStatus === 'D') { 
            deals++; totalAmount += 180000;
            // 恢复精准判定：仅自然日匹配才计入今日，补录单不影响今日看板
            if(cDate.toDateString() === todayStr) { 
                todayDeals++; todayAmount += 180000; 
            }
            let dateLabel = (cDate.getMonth()+1) + '-' + cDate.getDate();
            notices.push(`${cSales} 签单 (${dateLabel})`);
        }
        
        listEl.innerHTML += `<tr><td><input type="checkbox" class="ck" data-id="${c.id}"></td><td>${cName}</td><td>${cPhone}</td><td>${cSales}</td><td>${cStatus}</td><td>
            <select onchange="updateLogistics('${c.id}', this.value, '${cLog}')">
                ${["未发货", "已发货", "签收"].map(opt => `<option value="${opt}" ${cLog === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select></td><td><button onclick="addHistory('${c.id}')">+记录</button><button onclick="showHistory('${c.id}')">${d.log}</button></td><td><button onclick="deleteRow('${c.id}','${cStatus}')" style="background:#f44336">X</button></td></tr>`;
    });

    document.getElementById('taskList').innerHTML = tasks.join('<br>') || (lang=='zh'?'暂无':'Không có');
    document.getElementById('noticeList').style.display = notices.length > 0 ? 'block' : 'none';
    document.getElementById('noticeList').innerHTML = notices.slice(-5).reverse().join('<br>');
    document.getElementById('stats').innerHTML = `<div class="stat-box bg-today"><div class="stat-val">${todayAmount.toLocaleString()} VND</div><div class="stat-label">今日成交</div></div><div class="stat-box bg-total"><div class="stat-val">${totalAmount.toLocaleString()} VND</div><div class="stat-label">累计成交</div></div>`;
  };

  window.toggleLang = () => { lang = lang === 'zh' ? 'vi' : 'zh'; render(); };
  window.deleteSelected = async () => { for(let el of document.querySelectorAll('.ck:checked')) await deleteRow(el.dataset.id, data.find(c=>c.id==el.dataset.id).status); };
</script>
</body>
</html>
