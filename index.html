<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级业务总览 Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .text-glow { text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        .custom-input {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f1f5f9;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .custom-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 p-6 min-h-screen">

    <div class="fixed top-4 right-6 z-50 flex shadow-lg">
        <button onclick="toggleLang('zh')" class="px-3 py-1.5 bg-slate-800 text-xs text-white rounded-l border border-slate-700 hover:bg-slate-700 transition-colors">中文</button>
        <button onclick="toggleLang('vn')" class="px-3 py-1.5 bg-slate-800 text-xs text-white rounded-r border border-slate-700 hover:bg-slate-700 transition-colors">Tiếng Việt</button>
    </div>

    <div class="max-w-7xl mx-auto space-y-6">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-wide">全局销售与效能总览 <span class="text-sm font-normal text-slate-400 ml-2">流量归因版</span></h1>
                <p class="text-slate-400 mt-1">Global Traffic & Sales Performance Dashboard</p>
            </div>
            <div class="glass-card rounded-xl p-3 flex items-center space-x-3 text-sm">
                <span class="text-slate-400">过滤区间:</span>
                <input type="text" id="filter-start-date" class="custom-input p-1 text-xs w-28" placeholder="开始日期">
                <span class="text-slate-500">至</span>
                <input type="text" id="filter-end-date" class="custom-input p-1 text-xs w-28" placeholder="结束日期">
                <button onclick="handleFilter()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs transition-colors">筛选</button>
                <button onclick="resetFilter()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1 rounded text-xs transition-colors">重置</button>
            </div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
            <div class="glass-card rounded-xl p-5 hover:border-blue-500 transition-colors">
                <div class="text-sm text-slate-400 mb-1">总订单 (单)</div>
                <div id="kpi-total-orders" class="text-2xl font-bold text-white">0</div>
                <div class="text-xs text-green-400 mt-2">广告直接转化单</div>
            </div>
            <div class="glass-card rounded-xl p-5 hover:border-purple-500 transition-colors">
                <div class="text-sm text-slate-400 mb-1">总金额 (₫)</div>
                <div id="kpi-total-amount" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 text-glow">0</div>
                <div class="text-xs text-green-400 mt-2">源头流量总进账</div>
            </div>
            <div class="glass-card rounded-xl p-5 hover:border-red-500 transition-colors">
                <div class="text-sm text-slate-400 mb-1">总花费 (₫)</div>
                <div id="kpi-total-cost" class="text-2xl font-bold text-white">0</div>
                <div class="text-xs text-red-400 mt-2">广告实时消耗</div>
            </div>
            <div class="glass-card rounded-xl p-5 hover:border-blue-500 transition-colors">
                <div class="text-sm text-slate-400 mb-1">客户总人数</div>
                <div id="kpi-total-customers" class="text-2xl font-bold text-white">0</div>
                <div class="text-xs text-green-400 mt-2">广告进件线索量</div>
            </div>
            <div class="glass-card rounded-xl p-5 hover:border-green-500 transition-colors">
                <div class="text-sm text-slate-400 mb-1">全局 ROI</div>
                <div id="kpi-global-roi" class="text-2xl font-bold text-green-400 text-glow">0%</div>
                <div class="text-xs text-green-400 mt-2">纯广告投产核算</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
            <div class="glass-card rounded-xl p-6">
                <h2 class="text-lg font-semibold text-white mb-4 flex items-center">
                    <span class="w-2 h-4 bg-indigo-500 rounded mr-2"></span>销售个人数据大盘
                </h2>
                <div id="personal-stats-board" class="grid grid-cols-1 sm:grid-cols-2 gap-4 h-[300px] overflow-y-auto content-start">
                    </div>
            </div>

            <div class="glass-card rounded-xl p-6 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-white">🏆 今日开单播报 & 预警</h2>
                    <span class="flex h-3 w-3 relative">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                </div>
                <div id="dashboard-leaderboard" class="flex-1 overflow-y-auto space-y-3 pr-2">
                    </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
            <div class="glass-card rounded-xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-white flex items-center">
                        <span class="w-2 h-4 bg-blue-500 rounded mr-2"></span>人工销售转化录入
                    </h2>
                </div>
                <form id="sales-form" onsubmit="saveSalesRecord(event)" class="grid grid-cols-2 gap-4 text-sm">
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">选择时间</label>
                        <input type="text" id="sales-date" required class="custom-input">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">销售人员</label>
                        <select id="sales-name" required class="custom-input">
                            <option value="芳青">芳青</option>
                            <option value="文商">文商</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">人工线索认领量</label>
                        <input type="number" id="sales-leads" min="0" placeholder="0" required class="custom-input">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">促成订单 (单)</label>
                        <input type="number" id="sales-orders" min="0" placeholder="0" required class="custom-input" oninput="document.getElementById('sales-amount').value = this.value * 180000">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">订单金额 (₫)</label>
                        <input type="number" id="sales-amount" min="0" placeholder="180000" required class="custom-input">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">积累意向客户数</label>
                        <input type="number" id="sales-intended" min="0" placeholder="0" required class="custom-input">
                    </div>
                    <div class="col-span-2 mt-2">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg transition-colors shadow-lg shadow-blue-900/30">保存人工销售记录</button>
                    </div>
                </form>
            </div>

            <div class="glass-card rounded-xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-white flex items-center">
                        <span class="w-2 h-4 bg-purple-500 rounded mr-2"></span>广告直接转化录入
                    </h2>
                </div>
                <form id="ad-form" onsubmit="saveAdRecord(event)" class="grid grid-cols-2 gap-4 text-sm">
                    <div class="flex flex-col col-span-2">
                        <label class="text-slate-400 mb-1">选择时间</label>
                        <input type="text" id="ad-date" required class="custom-input">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">进件线索量</label>
                        <input type="number" id="ad-leads" min="0" placeholder="0" required class="custom-input">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">广告花费 (₫)</label>
                        <input type="number" id="ad-spend" min="0" placeholder="0" required class="custom-input">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">广告直接成单 (单)</label>
                        <input type="number" id="ad-orders" min="0" placeholder="0" required class="custom-input" oninput="document.getElementById('ad-amount').value = this.value * 180000">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-slate-400 mb-1">直出金额 (₫)</label>
                        <input type="number" id="ad-amount" min="0" placeholder="0" required class="custom-input">
                    </div>
                    <div class="col-span-2 mt-2">
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-2 rounded-lg transition-colors shadow-lg shadow-purple-900/30">保存广告投放记录</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="glass-card rounded-xl p-6 mt-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 border-b border-slate-700 pb-4">
                <div class="flex space-x-4 items-center">
                    <button id="tab-btn-sales" onclick="switchTab('sales')" class="text-lg font-semibold border-b-2 border-blue-500 text-white pb-2 px-1 focus:outline-none transition-all">销售历史明细</button>
                    <button id="tab-btn-ad" onclick="switchTab('ad')" class="text-lg font-semibold border-b-2 border-transparent text-slate-400 hover:text-white pb-2 px-1 focus:outline-none transition-all">广告历史明细</button>
                    
                    <select id="table-sales-filter" onchange="currentPage = 1; updateDashboard();" class="custom-input p-1 text-xs ml-4 border-slate-600 bg-slate-800 text-slate-300">
                        <option value="">全部销售人员</option>
                        <option value="芳青">芳青</option>
                        <option value="文商">文商</option>
                    </select>
                </div>
                <div class="text-xs text-slate-500">提示：点击右侧操作可彻底从云端清除记录</div>
            </div>
            <div class="overflow-x-auto w-full">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs tracking-wider">
                            <th id="th-1" class="pb-3 pl-2">时间</th>
                            <th id="th-2" class="pb-3">维度名称</th>
                            <th id="th-3" class="pb-3">线索数量</th>
                            <th id="th-4" class="pb-3">订单数量</th>
                            <th id="th-5" class="pb-3">订单金额</th>
                            <th id="th-6" class="pb-3">衍生指标 (意向/ROI)</th>
                            <th class="pb-3 text-right pr-2">操作</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="divide-y divide-slate-800/50 text-slate-300">
                        </tbody>
                </table>
            </div>
            <div class="flex justify-between items-center mt-4 pt-4 border-t border-slate-800 text-xs text-slate-400">
                <div id="pagination-info">显示第 0 到 0 条，共 0 条记录</div>
                <div class="flex space-x-2">
                    <button onclick="changePage(-1)" id="btn-prev-page" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded transition-colors">上一页</button>
                    <button onclick="changePage(1)" id="btn-next-page" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded transition-colors">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const todayStr = new Date().toISOString().split('T')[0];

        const flatpickrConfig = {
            locale: "zh",
            theme: "dark",
            dateFormat: "Y-m-d",
            disableMobile: false,
            onChange: function(selectedDates, dateStr, instance) {
                instance.element.dispatchEvent(new Event('change', { bubbles: true }));
                instance.element.dispatchEvent(new Event('input', { bubbles: true }));
            }
        };

        const filterStartPicker = flatpickr("#filter-start-date", flatpickrConfig);
        const filterEndPicker = flatpickr("#filter-end-date", flatpickrConfig);
        const salesDatePicker = flatpickr("#sales-date", { ...flatpickrConfig, defaultDate: todayStr });
        const adDatePicker = flatpickr("#ad-date", { ...flatpickrConfig, defaultDate: todayStr });

        let currentTab = 'sales';
        let currentPage = 1;
        const pageSize = 5;
        let dateFilter = { start: '', end: '' };

        // =======================================================
        // 🚀 核心接入点：Gist API 读写引擎
        // =======================================================
        const GIST_ID = '5ed15f91a2bc014938e74a57c61b4d1a';
        const GITHUB_TOKEN = ''; // 请填入你新生成的 Token
        
        let salesRecords = [];
        let adRecords = [];

        async function fetchCloudData() {
            try {
                document.getElementById('pagination-info').innerText = '⏳ 正在从云端同步最新数据，请稍候...';
                
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                const gist = await response.json();
                
                if(gist.message && gist.message.includes("Bad credentials")) {
                    alert('❌ Token 错误或未配置！请检查代码 GITHUB_TOKEN 设置。');
                    return;
                }

                if (gist.files) {
                    const salesContent = gist.files['sales.json'] ? gist.files['sales.json'].content : '[]';
                    const adsContent = gist.files['ads.json'] ? gist.files['ads.json'].content : '[]';
                    
                    salesRecords = JSON.parse(salesContent === "" ? "[]" : salesContent);
                    adRecords = JSON.parse(adsContent === "" ? "[]" : adsContent);
                }

                updateDashboard();
            } catch (error) {
                console.error('云端同步失败:', error);
                document.getElementById('pagination-info').innerText = '❌ 云端同步失败，请检查网络或 Token 配置。';
            }
        }

        async function saveToCloud() {
            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: {
                            'sales.json': { content: JSON.stringify(salesRecords) },
                            'ads.json': { content: JSON.stringify(adRecords) }
                        }
                    })
                });
                
                if (response.ok) {
                    const toast = document.createElement('div');
                    toast.className = 'fixed top-5 right-5 bg-emerald-600 text-white px-5 py-3 rounded-lg shadow-xl z-50 transition-opacity font-medium';
                    toast.innerText = '✅ 数据已成功同步至云端！';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2500);
                } else {
                    const err = await response.json();
                    alert(`❌ 上传失败: ${err.message}`);
                }
            } catch (error) {
                alert('数据上传云端失败，请检查网络环境！');
            }
        }

        function updateDashboard() {
            const filterData = (list) => {
                return list.filter(item => {
                    if (dateFilter.start && item.date < dateFilter.start) return false;
                    if (dateFilter.end && item.date > dateFilter.end) return false;
                    return true;
                });
            };

            const activeSales = filterData(salesRecords);
            const activeAd = filterData(adRecords);

            let totalOrders = activeAd.reduce((sum, item) => sum + (item.orders || 0), 0);
            let totalAmount = activeAd.reduce((sum, item) => sum + (item.amount || 0), 0);
            let totalCost = activeAd.reduce((sum, item) => sum + (item.spend || 0), 0);
            let totalCustomers = activeAd.reduce((sum, item) => sum + (item.leads || 0), 0);
            let globalRoi = totalCost > 0 ? ((totalAmount / totalCost) * 100).toFixed(0) + '%' : '0%';

            document.getElementById('kpi-total-orders').innerText = totalOrders.toLocaleString();
            document.getElementById('kpi-total-amount').innerText = totalAmount >= 1000000 ? (totalAmount / 1000000).toFixed(2) + 'M' : totalAmount.toLocaleString();
            document.getElementById('kpi-total-cost').innerText = totalCost >= 1000000 ? (totalCost / 1000000).toFixed(2) + 'M' : totalCost.toLocaleString();
            document.getElementById('kpi-total-customers').innerText = totalCustomers.toLocaleString();
            document.getElementById('kpi-global-roi').innerText = globalRoi;

            const salesReps = ['芳青', '文商'];
            let personalOrders = [];
            let personalAmount = [];
            let personalLeads = []; 

            salesReps.forEach((rep, idx) => {
                const repData = activeSales.filter(item => item.name === rep);
                personalOrders[idx] = repData.reduce((sum, item) => sum + item.orders, 0);
                personalAmount[idx] = repData.reduce((sum, item) => sum + item.amount, 0);
                personalLeads[idx] = repData.reduce((sum, item) => sum + item.leads, 0);
            });

            const pieData = salesReps.map((rep, idx) => ({
                name: rep,
                value: personalAmount[idx],
                orders: personalOrders[idx],
                leads: personalLeads[idx]
            }));

            // 🚀 1. 渲染：销售个人数据大盘 (卡片化展示)
            let personalBoardHtml = '';
            salesReps.forEach((rep, idx) => {
                personalBoardHtml += `
                    <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700 hover:border-indigo-500 transition-colors shadow-sm">
                        <div class="text-white font-bold text-base mb-3 flex justify-between items-center border-b border-slate-700 pb-2">
                            <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-indigo-400 mr-2"></span>${rep}</span>
                        </div>
                        <div class="space-y-3 mt-3">
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-slate-400">累计订单</span>
                                <span class="text-sm text-blue-400 font-bold">${personalOrders[idx]} 单</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-slate-400">累计金额</span>
                                <span class="text-sm text-purple-400 font-mono font-bold">₫${personalAmount[idx].toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-slate-400">客户总数</span>
                                <span class="text-sm text-emerald-400 font-bold">${personalLeads[idx]} 人</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('personal-stats-board').innerHTML = personalBoardHtml;

            // 2. 渲染：今日开单播报 & 预警
            let leaderboardHtml = '';
            let zeroOrderReps = [];

            const sortedReps = pieData.sort((a, b) => b.value - a.value);

            sortedReps.forEach((rep, index) => {
                if(rep.orders === 0) {
                    zeroOrderReps.push(rep.name);
                } else {
                    let badgeColor = index === 0 ? 'text-yellow-400' : index === 1 ? 'text-slate-300' : 'text-orange-400';
                    let badgeIcon = index === 0 ? '🥇' : index === 1 ? '🥈' : '🥉';
                    
                    leaderboardHtml += `
                    <div class="flex items-center justify-between bg-slate-800/50 p-3 rounded-lg border border-slate-700 hover:bg-slate-700/50 transition-colors">
                        <div class="flex items-center space-x-3">
                            <span class="text-xl font-bold ${badgeColor}">${badgeIcon}</span>
                            <div class="flex flex-col">
                                <span class="font-medium text-white">${rep.name}</span>
                                <span class="text-[10px] text-slate-400 mt-0.5">客户数: ${rep.leads} 人</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold text-green-400">+ ${rep.orders} 单</div>
                            <div class="text-xs font-mono text-slate-400">₫${rep.value.toLocaleString()}</div>
                        </div>
                    </div>`;
                }
            });

            if(zeroOrderReps.length > 0) {
                leaderboardHtml += `
                <div class="mt-4 p-3 bg-red-900/30 border border-red-500/50 rounded-lg animate-pulse">
                    <div class="flex items-center text-red-400 font-bold mb-1 text-sm">
                        ⚠️ 0 开单预警提示
                    </div>
                    <div class="text-xs text-red-300">
                        【${zeroOrderReps.join('、')}】 在当前筛选周期内暂未破蛋，请管理层及时介入辅导。
                    </div>
                </div>`;
            } else if (sortedReps.length > 0 && zeroOrderReps.length === 0) {
                leaderboardHtml += `
                <div class="mt-4 p-3 bg-emerald-900/30 border border-emerald-500/50 rounded-lg text-center text-emerald-400 text-sm font-medium">
                    🎉 太棒了！当前全员均已开单！
                </div>`;
            }

            document.getElementById('dashboard-leaderboard').innerHTML = leaderboardHtml;

            renderTable(activeSales, activeAd);
            if (currentLanguage === 'vn') applyTranslation();
        }

        function renderTable(activeSales, activeAd) {
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';

            let targetList = currentTab === 'sales' ? activeSales : activeAd;

            if (currentTab === 'sales') {
                const filterEl = document.getElementById('table-sales-filter');
                if (filterEl && filterEl.value !== '') {
                    targetList = targetList.filter(item => item.name === filterEl.value);
                }
            }

            targetList.sort((a, b) => new Date(b.date) - new Date(a.date));

            const totalRecords = targetList.length;
            const maxPage = Math.ceil(totalRecords / pageSize) || 1;
            if (currentPage > maxPage) currentPage = maxPage;

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, totalRecords);
            const pageData = targetList.slice(startIdx, endIdx);

            if (currentTab === 'sales') {
                document.getElementById('th-2').innerText = '销售人员';
                document.getElementById('th-3').innerText = '线索认领量';
                document.getElementById('th-6').innerText = '意向客户数';
            } else {
                document.getElementById('th-2').innerText = '广告花费';
                document.getElementById('th-3').innerText = '进件线索量';
                document.getElementById('th-6').innerText = '今日核算 ROI';
            }

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-500">暂无符合过滤条件的记录，请添加新纪录或重置筛选器。</td></tr>`;
            } else {
                pageData.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/30 transition-colors text-xs";
                    
                    if (currentTab === 'sales') {
                        tr.innerHTML = `
                            <td class="py-3 pl-2 font-mono">${item.date}</td>
                            <td class="py-3 font-medium text-white">${item.name}</td>
                            <td class="py-3">${item.leads}</td>
                            <td class="py-3">${item.orders}</td>
                            <td class="py-3 font-mono text-blue-400">₫${Number(item.amount).toLocaleString()}</td>
                            <td class="py-3"><span class="bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded">${item.intended} 人</span></td>
                            <td class="py-3 text-right pr-2"><button onclick="deleteRecord(${item.id})" class="text-red-400 hover:text-red-300 transition-colors">删除</button></td>
                        `;
                    } else {
                        const calculatedRoi = item.leads > 0 ? (item.amount / item.leads).toFixed(2) : '0.00';
                        tr.innerHTML = `
                            <td class="py-3 pl-2 font-mono">${item.date}</td>
                            <td class="py-3 font-mono text-purple-400">₫${Number(item.spend).toLocaleString()}</td>
                            <td class="py-3">${item.leads}</td>
                            <td class="py-3">${item.orders}</td>
                            <td class="py-3 font-mono text-green-400">₫${Number(item.amount).toLocaleString()}</td>
                            <td class="py-3"><span class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded">₫${calculatedRoi} /线索</span></td>
                            <td class="py-3 text-right pr-2"><button onclick="deleteRecord(${item.id})" class="text-red-400 hover:text-red-300 transition-colors">删除</button></td>
                        `;
                    }
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('pagination-info').innerText = `显示第 ${totalRecords > 0 ? startIdx + 1 : 0} 到 ${endIdx} 条，共 ${totalRecords} 条记录 | 页码: ${currentPage}/${maxPage}`;
            document.getElementById('btn-prev-page').disabled = currentPage === 1;
            document.getElementById('btn-next-page').disabled = currentPage === maxPage;
        }

        function switchTab(tab) {
            currentTab = tab;
            currentPage = 1;
            const salesBtn = document.getElementById('tab-btn-sales');
            const adBtn = document.getElementById('tab-btn-ad');
            const filterDropdown = document.getElementById('table-sales-filter');
            
            if (tab === 'sales') {
                salesBtn.className = "text-lg font-semibold border-b-2 border-blue-500 text-white pb-2 px-1 focus:outline-none transition-all";
                adBtn.className = "text-lg font-semibold border-b-2 border-transparent text-slate-400 hover:text-white pb-2 px-1 focus:outline-none transition-all";
                if(filterDropdown) filterDropdown.style.display = 'inline-block';
            } else {
                adBtn.className = "text-lg font-semibold border-b-2 border-purple-500 text-white pb-2 px-1 focus:outline-none transition-all";
                salesBtn.className = "text-lg font-semibold border-b-2 border-transparent text-slate-400 hover:text-white pb-2 px-1 focus:outline-none transition-all";
                if(filterDropdown) filterDropdown.style.display = 'none';
            }
            updateDashboard();
        }

        function changePage(direction) {
            currentPage += direction;
            updateDashboard();
        }

        function saveSalesRecord(e) {
            e.preventDefault();
            const newRecord = {
                id: Date.now(),
                date: document.getElementById('sales-date').value,
                name: document.getElementById('sales-name').value,
                leads: parseInt(document.getElementById('sales-leads').value) || 0,
                orders: parseInt(document.getElementById('sales-orders').value) || 0,
                amount: parseFloat(document.getElementById('sales-amount').value) || 0,
                intended: parseInt(document.getElementById('sales-intended').value) || 0
            };
            salesRecords.push(newRecord);
            
            saveToCloud(); 

            document.getElementById('sales-form').reset();
            salesDatePicker.setDate(todayStr);
            updateDashboard();
        }

        function saveAdRecord(e) {
            e.preventDefault();
            const newRecord = {
                id: Date.now(),
                date: document.getElementById('ad-date').value,
                leads: parseInt(document.getElementById('ad-leads').value) || 0,
                spend: parseFloat(document.getElementById('ad-spend').value) || 0,
                orders: parseInt(document.getElementById('ad-orders').value) || 0,
                amount: parseFloat(document.getElementById('ad-amount').value) || 0
            };
            adRecords.push(newRecord);
            
            saveToCloud(); 

            document.getElementById('ad-form').reset();
            adDatePicker.setDate(todayStr);
            updateDashboard();
        }

        function deleteRecord(id) {
            if (confirm('确认删除该条记录吗？这将在云端彻底清除且无法恢复！')) {
                if (currentTab === 'sales') {
                    salesRecords = salesRecords.filter(item => item.id !== id);
                } else {
                    adRecords = adRecords.filter(item => item.id !== id);
                }
                
                saveToCloud(); 
                updateDashboard();
            }
        }

        function handleFilter() {
            dateFilter.start = document.getElementById('filter-start-date').value;
            dateFilter.end = document.getElementById('filter-end-date').value;
            currentPage = 1;
            updateDashboard();
        }

        function resetFilter() {
            filterStartPicker.clear();
            filterEndPicker.clear();
            document.getElementById('table-sales-filter').value = ''; 
            dateFilter = { start: '', end: '' };
            currentPage = 1;
            updateDashboard();
        }

        fetchCloudData();

        let currentLanguage = 'zh';

        function applyTranslation() {
            const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
            let n;
            while(n = walk.nextNode()) {
                const text = n.textContent.trim();
                if (text.startsWith("客户数:") && text.endsWith("人")) {
                    n.textContent = text.replace("客户数:", "Khách hàng:").replace("人", "người");
                    continue;
                }
                if(i18nDict[text]) {
                    n.textContent = n.textContent.replace(text, i18nDict[text]);
                }
            }
            document.querySelectorAll('[placeholder]').forEach(el => {
                const ph = el.getAttribute('placeholder');
                if(i18nDict[ph]) el.setAttribute('placeholder', i18nDict[ph]);
            });
        }

        function toggleLang(lang) {
            if(lang === 'zh') { 
                location.reload(); 
                return; 
            }
            currentLanguage = 'vn';
            applyTranslation();
        }
